<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge"/>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title> change skin jwplayer6</title>
<!--  jwplayer.version="6.7.4071" -->
<!-- <script src="https://cdn.jsdelivr.net/jwplayer/6.7/jwplayer.js"></script> -->
<script src="jwplayer6/jwplayer.js" type="text/javascript"></script> 
<script>jwplayer.key='82QmuaEb7MLTRUwFW2U3PX1KblrfzSGrJXgaOLuj20w=';</script> 
<style>
body {margin: 0; padding: 0; background-color: #f9f9f9;}
select {
  cursor: pointer;
  display: inline-block;
  position: relative;
  font: normal 11px/22px Arial, Sans-Serif;
  color: black;
  border: 1px solid #ccc;
}
select {
  position: relative;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  background-color: white;
  padding: 8px 16px;
  font-weight: bold;
}
select:after {
  content: "";
  width: 0;
  height: 0;
  border: 5px solid transparent;
  border-color: black transparent transparent transparent;
  position: absolute;
  top: 9px;
  right: 6px;
}
select:active,
styledSelect.active {
  background-color: #eee;
}
options {
  display: none;
  position: absolute;
  top: 100%;
  right: 0;
  left: 0;
  z-index: 999;
  margin: 0 0;
  padding: 0 0;
  list-style: none;
  border: 1px solid #ccc;
  background-color: white;
  -webkit-box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
  -moz-box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
}
options li {
  padding: 0 6px;
  margin: 0 0;
  padding: 0 10px;
}

options li:hover {
background-color: #39f;
color: white;
}

#jwplayer {
position: relative;
overflow: hidden;
width: 99%;
max-width: 800px;
height: 430px;
}
</style>
</head><body onload="changeSkin()">
<center><h2> Change Skin jwplayer6</h2>
<select id="skin" onchange="changeSkin()">
  <option value="skins/vblue.xml">Select Skin</option>
  <option value="skins/bekle.xml">bekle</option>
  <option value="skins/beelden.xml">beelden</option>
  <option value="skins/five.xml">five</option>
  <option value="skins/glow.xml">glow</option>
  <option value="skins/jw6.xml">jw6</option>
  <option value="skins/mockup.xml">mockup</option>
  <option value="skins/modieus.xml">modieus</option>
  <option value="skins/roundster.xml">roundster</option>
  <option value="skins/six.xml">six</option>
  <option value="skins/stormtrooper.xml">stormtrooper</option>
 <option value="skins/vapor.xml">vapor</option>
 <option value="skins/vblue.xml">vblue</option>
</select><br/><br/>
<div id='jwplayer'></div></center>
<script>
// start function changeSkin
function changeSkin() {
const selectElement = document.getElementById('skin');
// Get the selected option
const selectedOption = selectElement.selectedOptions[0];
// Get the image URL from the data-image-url attribute
const skinUrl = selectedOption.getAttribute('value');
// Update the image source
if (skinUrl) {
var urlSkin = skinUrl;} 
else {var urlSkin = 'skins/five.xml'; }

// start code jwplayer
jwplayer('jwplayer').setup({
width: '99%',
height: '430',
image: "bg.jpg",
//file: "http://youtu.be/VSiSw6Jo2jQ",
file: "https://wetv.gitlab.io/1.mp4",
skin: urlSkin,
});

}
</script>
</body></html>

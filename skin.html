<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge"/>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title> vblue - Skin for jwplayer6</title>
<!--  jwplayer.version="6.7.4071" -->
<!-- <script src="https://cdn.jsdelivr.net/jwplayer/6.7/jwplayer.js"></script> -->
<script src="jwplayer6/jwplayer.js" type="text/javascript"></script> 
<script>jwplayer.key='82QmuaEb7MLTRUwFW2U3PX1KblrfzSGrJXgaOLuj20w=';</script> 
<style>
body {margin: 0; padding: 0; background-color: #f9f9f9;}
#jwplayer {
position: relative;
overflow: hidden;
width: 99%;
max-width: 800px;
height: 400px;
}
</style>
</head>
<body style="margin:0"><center><h1> change Skin for jwplayer6</h1>
<select id="skin" onchange="changeSkin()">
  <option value="">SelectSkin</option>
  <option value="skins/bekle.xml">bekle</option>
  <option value="skins/beelden.xml">beelden</option>
  <option value="https://kicktv.github.io/skin-jwplayer6/skins/five.xml">five</option>
  <option value="https://kicktv.github.io/skin-jwplayer6/skins/glow.xml">glow</option>
  <option value="https://kicktv.github.io/skin-jwplayer6/skins/jw6.xml">jw6</option>
  <option value="https://kicktv.github.io/skin-jwplayer6/skins/mockup.xml">mockup</option>
  <option value="https://kicktv.github.io/skin-jwplayer6/skins/modieus.xml">modieus</option>
  <option value="https://kicktv.github.io/skin-jwplayer6/skins/roundster.xml">roundster</option>
  <option value="skins/six.xml">six</option>
  <option value="https://kicktv.github.io/skin-jwplayer6/skins/stormtrooper.xml">stormtrooper</option>
 <option value="https://kicktv.github.io/skin-jwplayer6/skins/vapor.xml">vapor</option>
 <option value="https://kicktv.github.io/skin-jwplayer6/skins/vblue.xml">vblue</option>
</select>
<div id='jwplayer'></div></center>
<script>
// start function changeSkin
function changeSkin() {
const selectElement = document.getElementById('skin');
// Get the selected option
const selectedOption = selectElement.selectedOptions[0];
// Get the image URL from the data-image-url attribute
const skinUrl = selectedOption.getAttribute('value');
// Update the image source
if (skinUrl) {
var skin = skinUrl;} 
else {var skin = 'skins/vblue.xml'; }

// start code jwplayer
jwplayer('jwplayer').setup({
width: '700',
//height: '400',
image: "bg.jpg",
//file: "http://youtu.be/VSiSw6Jo2jQ",
file: "https://wetv.gitlab.io/1.mp4",
skin: skin,
});

}
</script>
</body></html>
